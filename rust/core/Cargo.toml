[package]
name = "ledger-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "The pure core of the ledger pipeline, a twin of the Scala core"

[dependencies]
# SHA-256 for the permanent ID layout (README section 7). Without default features it needs no standard library.
sha2 = { version = "0.11", default-features = false }

[dev-dependencies]
proptest = "1.12"

[lints]
workspace = true
