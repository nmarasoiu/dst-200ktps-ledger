# What the pipeline needs on a laptop: one Kafka broker and a single-node TigerBeetle. scripts/laptop.sh uses this.
services:
  kafka:
    image: apache/kafka:4.3.2
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # The design keeps committed offsets as long as the log: 30 days.
      KAFKA_OFFSETS_RETENTION_MINUTES: 43200
  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.17.9
    ports: ["3000:3000"]
    # io_uring, which TigerBeetle needs, is behind seccomp's default profile.
    security_opt: ["seccomp=unconfined"]
    entrypoint:
      - sh
      - -c
      - >-
        /tigerbeetle format --cluster=0 --replica=0 --replica-count=1 --development /tmp/0_0.tigerbeetle &&
        exec /tigerbeetle start --addresses=0.0.0.0:3000 --development --cache-grid=128MiB /tmp/0_0.tigerbeetle
